<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2027;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#203A43;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- 3D grid perspective -->
  <g stroke="#4DD0E1" stroke-opacity="0.2" stroke-width="1">
    <!-- Horizontal lines -->
    <line x1="200" y1="120" x2="600" y2="120"/>
    <line x1="180" y1="160" x2="620" y2="160"/>
    <line x1="160" y1="200" x2="640" y2="200"/>
    <line x1="140" y1="240" x2="660" y2="240"/>
    <line x1="120" y1="280" x2="680" y2="280"/>
    <!-- Vertical lines -->
    <line x1="200" y1="80" x2="120" y2="320"/>
    <line x1="300" y1="80" x2="260" y2="320"/>
    <line x1="400" y1="80" x2="400" y2="320"/>
    <line x1="500" y1="80" x2="540" y2="320"/>
    <line x1="600" y1="80" x2="680" y2="320"/>
  </g>
  <!-- 3D objects on grid -->
  <rect x="280" y="140" width="60" height="80" rx="4" fill="#4DD0E1" fill-opacity="0.15" stroke="#4DD0E1" stroke-opacity="0.4" stroke-width="1.5"/>
  <polygon points="310,100 340,140 280,140" fill="#4DD0E1" fill-opacity="0.1" stroke="#4DD0E1" stroke-opacity="0.3" stroke-width="1"/>
  <circle cx="460" cy="190" r="35" fill="#26C6DA" fill-opacity="0.12" stroke="#26C6DA" stroke-opacity="0.4" stroke-width="1.5"/>
  <rect x="540" y="170" width="80" height="50" rx="4" fill="#80DEEA" fill-opacity="0.12" stroke="#80DEEA" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Marble label -->
  <rect x="330" y="250" width="140" height="28" rx="6" fill="#4DD0E1" fill-opacity="0.1" stroke="#4DD0E1" stroke-opacity="0.3" stroke-width="1"/>
  <text x="400" y="269" font-family="monospace" font-size="12" fill="#4DD0E1" fill-opacity="0.7" text-anchor="middle">MARBLE</text>
  <!-- Stats -->
  <text x="130" y="380" font-family="monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.5">$1B RAISED</text>
  <text x="330" y="380" font-family="monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.5">$200M AUTODESK</text>
  <text x="560" y="380" font-family="monospace" font-size="12" fill="#FFFFFF" fill-opacity="0.5">~$5B VALUATION</text>
  <!-- Title -->
  <text x="400" y="430" font-family="monospace" font-size="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">WORLD LABS SPATIAL AI</text>
</svg>